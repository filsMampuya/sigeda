services:
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ../monitoring/prometheus/prometheus.preprod.yml:/etc/prometheus/prometheus.yml:ro
      - ${SIGEDA_DATA_ROOT}/prometheus:/prometheus
    ports:
      - "127.0.0.1:${SIGEDA_PROMETHEUS_PORT}:9090"
    networks:
      - backend

  grafana:
    image: grafana/grafana:11.1.4
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${SIGEDA_GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${SIGEDA_GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${SIGEDA_GRAFANA_ROOT_URL}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    depends_on:
      - prometheus
    volumes:
      - ${SIGEDA_DATA_ROOT}/grafana:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:${SIGEDA_GRAFANA_PORT}:3000"
    networks:
      - backend

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"
    networks:
      - backend

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - backend
