services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${SIGEDA_POSTGRES_DB:-sigeda}
      POSTGRES_USER: ${SIGEDA_POSTGRES_USER:-sigeda}
      POSTGRES_PASSWORD: ${SIGEDA_POSTGRES_PASSWORD:-sigeda}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SIGEDA_POSTGRES_USER:-sigeda} -d ${SIGEDA_POSTGRES_DB:-sigeda}"]
      interval: 10s
      timeout: 5s
      retries: 10
  pgadmin:
    image: dpage/pgadmin4
    container_name: sigeda-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${SIGEDA_PGADMIN_EMAIL:-admin@sigeda.dev}
      PGADMIN_DEFAULT_PASSWORD: ${SIGEDA_PGADMIN_PASSWORD:-SigedaPgAdmin_2026!}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_LOGIN_BANNER: "'SIGEDA PostgreSQL Administration'"
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: 20
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgpass:ro
      - pgadmin-data:/var/lib/pgadmin

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SIGEDA_MINIO_ROOT_USER:-sigeda}
      MINIO_ROOT_PASSWORD: ${SIGEDA_MINIO_ROOT_PASSWORD:-sigeda-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --hostname=http://localhost:8080 --import-realm
    environment:
      KEYCLOAK_ADMIN: ${SIGEDA_KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${SIGEDA_KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/sigeda-realm.json:/opt/keycloak/data/import/sigeda-realm.json:ro

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    environment:
      discovery.type: single-node
      plugins.security.disabled: ${SIGEDA_OPENSEARCH_SECURITY_DISABLED:-true}
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${SIGEDA_OPENSEARCH_ADMIN_PASSWORD:-CentralBankSearch_2026!Vault}
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      HTTP_PROXY: ${SIGEDA_HTTP_PROXY:-}
      HTTPS_PROXY: ${SIGEDA_HTTPS_PROXY:-}
      NO_PROXY: ${SIGEDA_NO_PROXY:-}
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20

  ollama-pull:
    image: ollama/ollama:latest
    profiles:
      - ai-bootstrap
    entrypoint:
      - /bin/sh
      - -lc
    environment:
      OLLAMA_HOST: http://ollama:11434
      VISION_MODEL: ${SIGEDA_DOCUMENT_AI_VISION_MODEL:-moondream}
      TEXT_MODEL: ${SIGEDA_DOCUMENT_AI_TEXT_MODEL:-qwen2.5:0.5b}
      HTTP_PROXY: ${SIGEDA_HTTP_PROXY:-}
      HTTPS_PROXY: ${SIGEDA_HTTPS_PROXY:-}
      NO_PROXY: ${SIGEDA_NO_PROXY:-}
    depends_on:
      ollama:
        condition: service_healthy
    command:
      - |
        set -e
        ollama pull "$$VISION_MODEL"
        if [ "$$TEXT_MODEL" != "$$VISION_MODEL" ]; then
          ollama pull "$$TEXT_MODEL"
        fi

  api-nest:
    build:
      context: ../..
      dockerfile: apps/api-nest/Dockerfile
      args:
        INSTALL_DOCUMENT_AI_SYSTEM_DEPS: ${SIGEDA_API_INSTALL_SYSTEM_OCR:-true}
        HTTP_PROXY: ${SIGEDA_HTTP_PROXY:-}
        HTTPS_PROXY: ${SIGEDA_HTTPS_PROXY:-}
        NO_PROXY: ${SIGEDA_NO_PROXY:-}
    environment:
      PORT: 4100
      DATABASE_URL: postgresql://${SIGEDA_POSTGRES_USER:-sigeda}:${SIGEDA_POSTGRES_PASSWORD:-sigeda}@postgres:5432/${SIGEDA_POSTGRES_DB:-sigeda}
      KEYCLOAK_ISSUER: ${SIGEDA_KEYCLOAK_ISSUER:-http://localhost:8080/realms/sigeda}
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/sigeda/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: ${SIGEDA_KEYCLOAK_CLIENT_ID:-sigeda-web}
      KEYCLOAK_REALM: ${SIGEDA_KEYCLOAK_REALM:-sigeda}
      KEYCLOAK_ADMIN_BASE_URL: ${SIGEDA_KEYCLOAK_ADMIN_BASE_URL:-http://keycloak:8080}
      KEYCLOAK_ADMIN_USERNAME: ${SIGEDA_KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${SIGEDA_KEYCLOAK_ADMIN_PASSWORD:-admin}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${SIGEDA_MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_BUCKET: ${SIGEDA_MINIO_BUCKET:-sigeda-documents}
      MINIO_ACCESS_KEY: ${SIGEDA_MINIO_ROOT_USER:-sigeda}
      MINIO_SECRET_KEY: ${SIGEDA_MINIO_ROOT_PASSWORD:-sigeda-password}
      OPENSEARCH_NODE: http://opensearch:9200
      CORS_ORIGIN: ${SIGEDA_CORS_ORIGIN:-http://localhost:8088,http://localhost:3000}
      HTTP_BODY_LIMIT: ${SIGEDA_HTTP_BODY_LIMIT:-10mb}
      MAX_DOCUMENT_UPLOAD_BYTES: ${SIGEDA_MAX_DOCUMENT_UPLOAD_BYTES:-26214400}
      DOCUMENT_AI_MODE: ${SIGEDA_DOCUMENT_AI_MODE:-ocr}
      DOCUMENT_AI_TIMEOUT_MS: ${SIGEDA_DOCUMENT_AI_TIMEOUT_MS:-180000}
      DOCUMENT_AI_OLLAMA_KEEP_ALIVE: ${SIGEDA_DOCUMENT_AI_OLLAMA_KEEP_ALIVE:-15m}
      DOCUMENT_AI_OLLAMA_TEMPERATURE: ${SIGEDA_DOCUMENT_AI_OLLAMA_TEMPERATURE:-0}
      DOCUMENT_AI_OLLAMA_NUM_PREDICT: ${SIGEDA_DOCUMENT_AI_OLLAMA_NUM_PREDICT:-160}
      DOCUMENT_AI_MAX_OCR_TEXT_CHARS: ${SIGEDA_DOCUMENT_AI_MAX_OCR_TEXT_CHARS:-4000}
      DOCUMENT_AI_VISION_BASE_URL: ${SIGEDA_DOCUMENT_AI_VISION_BASE_URL:-http://ollama:11434}
      DOCUMENT_AI_VISION_MODEL: ${SIGEDA_DOCUMENT_AI_VISION_MODEL:-moondream}
      DOCUMENT_AI_TEXT_BASE_URL: ${SIGEDA_DOCUMENT_AI_TEXT_BASE_URL:-http://ollama:11434}
      DOCUMENT_AI_TEXT_MODEL: ${SIGEDA_DOCUMENT_AI_TEXT_MODEL:-qwen2.5:0.5b}
      DOCUMENT_AI_LOW_CONFIDENCE_THRESHOLD: ${SIGEDA_DOCUMENT_AI_LOW_CONFIDENCE_THRESHOLD:-0.70}
      DOCUMENT_AI_DEBUG: ${SIGEDA_DOCUMENT_AI_DEBUG:-true}
      DOCUMENT_AI_TEMP_BUCKET_PREFIX: ${SIGEDA_DOCUMENT_AI_TEMP_BUCKET_PREFIX:-tmp/document-intelligence}
      OCR_PROVIDER: ${SIGEDA_OCR_PROVIDER:-tesseract-cli}
      OCR_LANGUAGE: ${SIGEDA_OCR_LANGUAGE:-fra+eng}
      OCR_IMAGE_COPY_WIDTH_PERCENT: ${SIGEDA_OCR_IMAGE_COPY_WIDTH_PERCENT:-41}
      OCR_IMAGE_COPY_HEIGHT_PERCENT: ${SIGEDA_OCR_IMAGE_COPY_HEIGHT_PERCENT:-29}
      OCR_TIMEOUT_MS: ${SIGEDA_OCR_TIMEOUT_MS:-60000}
      OCR_TEMP_DIR: ${SIGEDA_OCR_TEMP_DIR:-/tmp/sigeda-ocr}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      minio:
        condition: service_started
      opensearch:
        condition: service_started
    ports:
      - "4100:4100"

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      SIGEDA_API_URL: http://api-nest:4100
      NEXT_PUBLIC_SIGEDA_API_URL: http://localhost:4100
      SIGEDA_ON_PREMISE_API_URL: http://api-nest:4100/api/v1
      NEXT_PUBLIC_SIGEDA_ON_PREMISE_API_URL: http://localhost:4100/api/v1
      KEYCLOAK_URL: ${SIGEDA_KEYCLOAK_URL:-http://localhost:8080}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${SIGEDA_KEYCLOAK_REALM:-sigeda}
      KEYCLOAK_CLIENT_ID: ${SIGEDA_KEYCLOAK_CLIENT_ID:-sigeda-web}
      NEXT_PUBLIC_KEYCLOAK_URL: ${SIGEDA_KEYCLOAK_URL:-http://localhost:8080}
      NEXT_PUBLIC_KEYCLOAK_REALM: ${SIGEDA_KEYCLOAK_REALM:-sigeda}
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${SIGEDA_KEYCLOAK_CLIENT_ID:-sigeda-web}
      DOCUMENT_AI_DEBUG: ${SIGEDA_DOCUMENT_AI_DEBUG:-true}
    depends_on:
      - api-nest
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8088:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-nest
      - web

volumes:
  postgres-data:
  pgadmin-data:
  minio-data:
  opensearch-data:
  ollama-data:
